<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>记录与设置 · 刷之前想一下</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="journal.js"></script>
</head>
<body>
  <header class="topbar">
    <span class="brand"><span class="mark" aria-hidden="true">Ⅱ</span>刷之前想一下</span>
    <span class="local-label"><span id="data-mode">仅保存在本地</span> · <span id="version"></span></span>
  </header>
  <main class="journal-main">
    <nav class="tabs" aria-label="页面">
      <button id="overview-tab" class="tab active" aria-pressed="true">回顾</button>
      <button id="sites-tab" class="tab" aria-pressed="false">网站</button>
      <button id="records-tab" class="tab" aria-pressed="false">记录</button>
      <button id="settings-tab" class="tab" aria-pressed="false">设置</button>
      <button id="sync-tab" class="tab" aria-pressed="false">同步</button>
    </nav>
    <section id="overview-panel">
      <div class="section-heading">
        <div><h1>时间，花在自己的选择上</h1><p id="overview-range" class="range-label"></p></div>
        <div class="period-control" aria-label="回顾周期">
          <button type="button" data-period="7" aria-pressed="true">近 7 天</button>
          <button type="button" data-period="30" aria-pressed="false">近 30 天</button>
        </div>
      </div>
      <dl class="stats overview-stats">
        <div><dt title="已观测到的聚焦窗口、活动标签页时间，不等同于实际观看或注意力">前台浏览</dt><dd id="insight-foreground">未观测</dd></div>
        <div><dt>开始浏览</dt><dd id="insight-entries">0</dd></div>
        <div><dt>打开前选择离开</dt><dd id="insight-declined">0</dd></div>
        <div><dt>提前结束并关闭</dt><dd id="insight-done">0</dd></div>
      </dl>
      <div class="section-heading"><h2>每天的前台浏览</h2><span id="measurement-status" class="range-label"></span></div>
      <div id="daily-chart" class="daily-chart" role="list" aria-label="每日前台浏览时长"></div>
      <div class="section-heading site-heading"><h2>网站</h2><button id="manage-sites" class="text-button" type="button">管理网站</button></div>
      <div id="site-summary" class="site-summary"></div>
      <p id="overview-empty" class="empty">还没有浏览记录。</p>
      <p id="decision-summary" class="decision-summary"></p>
    </section>
    <section id="sites-panel" hidden>
      <h1 id="sites-heading">网站与例外</h1>
      <p id="site-access-state" class="range-label" role="status"></p>
      <form id="site-rules-form" class="rules-form">
        <div id="site-rules" class="rule-list"></div>
        <fieldset class="rule-add">
          <legend>添加网站</legend>
          <label for="site-domain">域名</label>
          <div class="inline-field"><input id="site-domain" placeholder="youtube.com" autocomplete="off" spellcheck="false"><button id="site-add" class="secondary" type="button">添加</button></div>
        </fieldset>
        <fieldset class="rule-add">
          <legend>直接放行的例外</legend>
          <div id="site-exceptions"></div>
          <label for="exception-url">网址</label>
          <input id="exception-url" type="url" placeholder="https://www.bilibili.com/list/ml123456" autocomplete="off" spellcheck="false">
          <div class="inline-field">
            <select id="exception-mode" aria-label="例外范围"><option value="page">精确页面 · 含参数和片段</option><option value="path">此路径及子路径 · 不限参数</option></select>
            <button id="exception-add" class="secondary" type="button">添加</button>
          </div>
        </fieldset>
        <fieldset class="sites"><legend>时间到了</legend>
          <label class="check-label"><input type="radio" name="sites-expiry-action" value="pause" checked>暂停，保留当前页面</label>
          <label class="check-label"><input type="radio" name="sites-expiry-action" value="close">直接关闭关联标签页</label>
        </fieldset>
        <div class="rule-actions"><button id="site-save" class="primary" type="submit">保存网站</button><button id="setup-skip" class="text-button" type="button" hidden>暂不启用</button></div>
      </form>
      <a id="site-trial" class="trial-link" target="_blank" rel="noreferrer" hidden></a>
    </section>
    <section id="records-panel" hidden>
      <div class="section-heading"><h1>浏览记录</h1><button id="export" class="secondary">导出 JSON</button></div>
      <div class="filters">
        <label>日期<input id="date-filter" type="date"></label>
        <label>网站<select id="site-filter"><option value="">全部网站</option><option value="douyin">抖音</option><option value="xiaohongshu">小红书</option><option value="bilibili">哔哩哔哩</option></select></label>
        <button id="all-dates" class="text-button">全部日期</button>
      </div>
      <dl class="stats">
        <div><dt>访问尝试</dt><dd id="attempt-count">0</dd></div>
        <div><dt>选择进入</dt><dd id="visit-count">0</dd></div>
        <div><dt>选择离开</dt><dd id="decline-count">0</dd></div>
        <div><dt>访问经过时间</dt><dd id="total-time">0:00</dd></div>
      </dl>
      <div class="table-scroll">
        <table><thead><tr><th>时间</th><th>网站</th><th>用途</th><th>计划</th><th>经过</th><th>前台</th><th>结束方式</th></tr></thead><tbody id="record-rows"></tbody></table>
      </div>
      <p id="empty" class="empty" hidden>这段时间还没有记录。</p>
      <div class="records-footer"><button id="clear" class="text-button danger">清除已结束的记录</button><span id="record-count"></span></div>
    </section>
    <section id="settings-panel" hidden>
      <h1>设置</h1>
      <form id="settings-form" class="settings-form">
        <label for="exit-url">离开后前往</label>
        <input id="exit-url" type="url" required>
        <label for="quote-input">确认页台词</label>
        <textarea id="quote-input" maxlength="300" rows="3" required></textarea>
        <label for="reasons-input">预设用途 · 每行一项</label>
        <textarea id="reasons-input" rows="5"></textarea>
        <label for="warning-input">提前提醒 · 秒</label>
        <input id="warning-input" type="number" min="1" max="300" required>
        <fieldset class="sites"><legend>时间到了</legend>
          <label class="check-label"><input type="radio" name="expiry-action" value="pause" checked>暂停，保留当前页面</label>
          <label class="check-label"><input type="radio" name="expiry-action" value="close">直接关闭关联标签页</label>
        </fieldset>
        <button class="primary" type="submit">保存设置</button>
      </form>
    </section>
    <section id="sync-panel" hidden>
      <h1>WebDAV 同步</h1>
      <form id="sync-form" class="settings-form">
        <label class="check-label"><input id="sync-enabled" type="checkbox">启用自动同步 · 每 5 分钟</label>
        <label for="sync-url">同步目录 · HTTPS</label>
        <input id="sync-url" type="url" placeholder="https://dav.example.com/webdav/back-to-flow/" autocomplete="off" spellcheck="false">
        <label for="sync-username">用户名</label>
        <input id="sync-username" autocomplete="off" maxlength="256" spellcheck="false">
        <label for="sync-password">密码</label>
        <input id="sync-password" type="password" autocomplete="new-password" maxlength="1024">
        <label class="check-label"><input id="sync-records" type="checkbox" checked>同步已结束的记录（含用途）</label>
        <button id="sync-save" class="primary" type="submit">保存连接</button>
      </form>
      <div class="sync-summary">
        <dl class="sync-details">
          <div><dt>同步状态</dt><dd id="sync-state">未启用</dd></div>
          <div><dt>最近成功</dt><dd id="sync-last-success">尚未同步</dd></div>
        </dl>
        <p id="sync-error" role="status"></p>
        <div class="sync-actions">
          <button id="sync-now" class="secondary" type="button" disabled>立即同步</button>
          <button id="sync-forget" class="text-button danger" type="button">移除本机连接</button>
          <button id="restore-settings" class="text-button" type="button" hidden>恢复同步前设置</button>
        </div>
      </div>
    </section>
    <p id="status" role="status"></p>
  </main>
</body>
</html>
